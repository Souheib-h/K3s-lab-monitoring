---
- name: Audit des routes IP sur toutes les VMs
  hosts: all
  gather_facts: false
  tasks:
    - name: Récupérer la table de routage
      ansible.builtin.command: ip route
      register: routes
      changed_when: false

    - name: Afficher les routes
      ansible.builtin.debug:
        msg: "{{ routes.stdout_lines }}"
