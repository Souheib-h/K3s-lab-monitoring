---
# install-alloy.yml — deploy Grafana Alloy on every lab host, shipping syslog to Loki
# Download happens ONCE on the control node, then the binary is pushed over the
# local network (GitHub x13 at ~1-2 MB/s would take hours).
#
# ansible-srv is excluded: its /tmp is too small to gather facts reliably and
# the control node does not need its own logs shipped (see phase-8 doc).
#
# Variables (alloy_version, loki_push_url): inventory/group_vars/all/main.yml
# Run: ansible-playbook -i inventory/hosts.yml playbooks/install-alloy.yml

- name: Stage the Alloy binary on the control node
  hosts: localhost
  gather_facts: false
  vars:
    alloy_zip_url: "https://github.com/grafana/alloy/releases/download/{{ alloy_version }}/alloy-linux-amd64.zip"
    # Under $HOME, not /tmp (tmpfs too small, see phase-8 pitfalls); one dir per version
    alloy_staging: "{{ lookup('ansible.builtin.env', 'HOME') }}/alloy-staging/{{ alloy_version }}"

  tasks:
    - name: Create staging dir
      ansible.builtin.file:
        path: "{{ alloy_staging }}"
        state: directory
        mode: "0755"

    - name: Download Alloy release zip
      ansible.builtin.get_url:
        url: "{{ alloy_zip_url }}"
        dest: "{{ alloy_staging }}/alloy.zip"
        mode: "0644"

    - name: Extract binary
      ansible.builtin.unarchive:
        src: "{{ alloy_staging }}/alloy.zip"
        dest: "{{ alloy_staging }}"
        remote_src: true
        creates: "{{ alloy_staging }}/alloy-linux-amd64"

    # A truncated extract would otherwise be pushed to every host
    - name: Smoke-test the extracted binary
      ansible.builtin.command: "{{ alloy_staging }}/alloy-linux-amd64 --version"
      changed_when: false

    # The control node disk is small: keep only the extracted current version
    - name: Remove the downloaded zip
      ansible.builtin.file:
        path: "{{ alloy_staging }}/alloy.zip"
        state: absent

    - name: Find staging content from other versions
      ansible.builtin.find:
        paths: "{{ alloy_staging | dirname }}"
        file_type: any
        excludes: "{{ alloy_version }}"
      register: old_staging

    - name: Remove staging content from other versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_staging.files }}"
      loop_control:
        label: "{{ item.path }}"

- name: Deploy Grafana Alloy agents
  hosts: all:!ansible_control
  become: true
  vars:
    alloy_staging: "{{ lookup('ansible.builtin.env', 'HOME') }}/alloy-staging/{{ alloy_version }}"
    syslog_path: "{{ '/var/log/messages' if ansible_os_family == 'Alpine' else '/var/log/syslog' }}"

  tasks:
    # ── 1. Push the binary to every host ─────────────────────────────────
    - name: Copy Alloy binary
      ansible.builtin.copy:
        src: "{{ alloy_staging }}/alloy-linux-amd64"
        dest: /usr/local/bin/alloy
        mode: "0755"
      notify: Restart alloy

    # ── 2. Alpine only — glibc compat for the upstream binary ────────────
    - name: Install gcompat (Alpine — upstream binary links against glibc)
      community.general.apk:
        name: gcompat
        state: present
        update_cache: true
      when: ansible_os_family == "Alpine"

    # ── 3. Directories ───────────────────────────────────────────────────
    - name: Create Alloy directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /etc/alloy
        - /var/lib/alloy
        - /var/log/alloy

    # ── 4. Config (templated per host) ───────────────────────────────────
    - name: Deploy Alloy config
      ansible.builtin.template:
        src: config.alloy.j2
        dest: /etc/alloy/config.alloy
        mode: "0644"
      notify: Restart alloy

    # ── 5. Service — OpenRC on Alpine, systemd on Ubuntu ─────────────────
    - name: Install service (Alpine — OpenRC)
      when: ansible_os_family == "Alpine"
      block:
        - name: Deploy OpenRC init script
          ansible.builtin.copy:
            src: alloy.initd
            dest: /etc/init.d/alloy
            mode: "0755"
        - name: Enable and start alloy
          ansible.builtin.service:
            name: alloy
            state: started
            enabled: true

    - name: Install service (Ubuntu — systemd)
      when: ansible_os_family == "Debian"
      block:
        - name: Deploy systemd unit
          ansible.builtin.copy:
            src: alloy.service
            dest: /etc/systemd/system/alloy.service
            mode: "0644"
        - name: Enable and start alloy
          ansible.builtin.systemd:
            name: alloy
            state: started
            enabled: true
            daemon_reload: true

  handlers:
    - name: Restart alloy
      ansible.builtin.service:
        name: alloy
        state: restarted
