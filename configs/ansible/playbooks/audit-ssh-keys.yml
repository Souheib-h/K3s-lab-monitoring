# audit-ssh-keys.yml
---
- name: Audit des clés SSH autorisées sur chaque VM
  hosts: all
  gather_facts: false
  tasks:
    - name: Récupérer le contenu de authorized_keys
      shell: cat ~/.ssh/authorized_keys 2>/dev/null || echo "AUCUN FICHIER"
      register: auth_keys
      changed_when: false

    - name: Afficher le contenu brut
      debug:
        msg: "{{ auth_keys.stdout_lines }}"

    - name: Extraire les fingerprints (une ligne par clé)
      shell: |
        ssh-keygen -lf ~/.ssh/authorized_keys 2>/dev/null || echo "ERREUR LECTURE"
      register: fingerprints
      changed_when: false

    - name: Afficher les fingerprints
      debug:
        msg: "{{ fingerprints.stdout_lines }}"
