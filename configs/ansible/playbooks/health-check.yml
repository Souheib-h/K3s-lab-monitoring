---
# health-check.yml — Vérification de santé de toutes les VMs du lab
#
# Vérifie, par hôte : connectivité réseau croisée (bastion-net/k3s-net/monitoring-net),
# charge système, disque, RAM, et statut des services clés (Zabbix agent, Wazuh agent,
# Alloy si présent).
#
# Tout passe par les facts Ansible et service_facts (systemd ET OpenRC) :
# pas de pipes shell, donc même comportement sur Ubuntu et Alpine.
#
# Usage : ansible-playbook -i inventory/hosts.yml playbooks/health-check.yml
# Usage ciblé : ansible-playbook -i inventory/hosts.yml playbooks/health-check.yml --limit monitoring_stack

- name: Health check du parc
  hosts: all
  gather_facts: true
  vars:
    disk_warn_threshold: 80   # % d'utilisation disque déclenchant un warning
    mem_warn_threshold: 90    # % d'utilisation RAM déclenchant un warning
    # Noms de service candidats : unité systemd (Ubuntu) puis service OpenRC (Alpine)
    svc_candidates:
      zabbix: [zabbix-agent.service, zabbix-agent2.service, zabbix-agentd]
      wazuh: [wazuh-agent.service, wazuh-agentd]
      alloy: [alloy.service, alloy]

  tasks:
    # ── 1. Connectivité croisée vers les 3 réseaux du lab ──────────────────
    - name: Vérifier la route vers bastion-net (10.30.0.10)
      ansible.builtin.command: ping -c 2 -W 2 10.30.0.10
      register: ping_bastion
      changed_when: false
      failed_when: false

    - name: Vérifier la route vers k3s-net (10.10.0.254)
      ansible.builtin.command: ping -c 2 -W 2 10.10.0.254
      register: ping_k3s
      changed_when: false
      failed_when: false

    - name: Vérifier la route vers monitoring-net (10.20.0.254)
      ansible.builtin.command: ping -c 2 -W 2 10.20.0.254
      register: ping_monitoring
      changed_when: false
      failed_when: false

    # ── 2. Ressources système (facts) ───────────────────────────────────────
    - name: Lire l'utilisation disque de la racine (df -P, commun à coreutils et busybox)
      ansible.builtin.command: df -P /
      register: df_root
      changed_when: false

    - name: Lire la charge système
      ansible.builtin.slurp:
        src: /proc/loadavg
      register: loadavg_raw

    - name: Calculer disque, RAM, charge et uptime
      ansible.builtin.set_fact:
        disk_usage: "{{ df_root.stdout_lines[-1].split()[4] | replace('%', '') | int }}"
        mem_usage: "{{ (100 * ansible_facts.memory_mb.nocache.used / ansible_facts.memory_mb.real.total) | round | int }}"
        load_avg: "{{ (loadavg_raw.content | b64decode).split()[0] }}"
        sys_uptime: >-
          {{ (ansible_facts.uptime_seconds // 86400) }}j
          {{ (ansible_facts.uptime_seconds % 86400 // 3600) }}h
          {{ (ansible_facts.uptime_seconds % 3600 // 60) }}min

    # ── 3. Services clés (tolérant à l'absence — pas tous les hosts les ont) ─
    - name: Collecter l'état des services
      ansible.builtin.service_facts:

    - name: Normaliser l'état des agents (active / stopped / not-installed)
      vars:
        svc_list: "{{ ansible_facts.services | dict2items }}"
      ansible.builtin.set_fact:
        zabbix_status: "{{ svc_list | selectattr('key', 'in', svc_candidates.zabbix) | map(attribute='value.state')
          | map('regex_replace', '^(running|started)$', 'active') | first | default('not-installed') }}"
        wazuh_status: "{{ svc_list | selectattr('key', 'in', svc_candidates.wazuh) | map(attribute='value.state')
          | map('regex_replace', '^(running|started)$', 'active') | first | default('not-installed') }}"
        alloy_status: "{{ svc_list | selectattr('key', 'in', svc_candidates.alloy) | map(attribute='value.state')
          | map('regex_replace', '^(running|started)$', 'active') | first | default('not-installed') }}"

    # ── 4. Synthèse par hôte ─────────────────────────────────────────────────
    - name: Afficher le rapport de santé
      ansible.builtin.debug:
        msg:
          - "=== {{ inventory_hostname }} ({{ ansible_host | default('local') }}) ==="
          - "Uptime          : {{ sys_uptime }}"
          - "Load average    : {{ load_avg }}"
          - "Disque /        : {{ disk_usage }}% {{ '⚠️  AU DESSUS DU SEUIL' if disk_usage | int >= disk_warn_threshold else '✅' }}"
          - "RAM             : {{ mem_usage }}% {{ '⚠️  AU DESSUS DU SEUIL' if mem_usage | int >= mem_warn_threshold else '✅' }}"
          - "Route bastion   : {{ '✅ OK' if ping_bastion.rc == 0 else '❌ ÉCHEC' }}"
          - "Route k3s-net   : {{ '✅ OK' if ping_k3s.rc == 0 else '❌ ÉCHEC' }}"
          - "Route monitoring: {{ '✅ OK' if ping_monitoring.rc == 0 else '❌ ÉCHEC' }}"
          - "Zabbix agent    : {{ zabbix_status }}"
          - "Wazuh agent     : {{ wazuh_status }}"
          - "Alloy           : {{ alloy_status }}"

    # ── 5. Marquer les hôtes en échec pour le récap final ───────────────────
    - name: Marquer les échecs réseau et ressources
      ansible.builtin.set_fact:
        network_ok: "{{ ping_bastion.rc == 0 and ping_k3s.rc == 0 and ping_monitoring.rc == 0 }}"
        resources_ok: "{{ disk_usage | int < disk_warn_threshold and mem_usage | int < mem_warn_threshold }}"

- name: Récapitulatif global
  hosts: all
  gather_facts: false
  tasks:
    - name: Lister les hôtes avec un problème réseau
      ansible.builtin.debug:
        msg: "⚠️  {{ inventory_hostname }} a un problème de routage réseau"
      when: not network_ok | default(true)

    - name: Lister les hôtes avec un problème de ressources
      ansible.builtin.debug:
        msg: "⚠️  {{ inventory_hostname }} dépasse un seuil de ressources (disque/RAM)"
      when: not resources_ok | default(true)
