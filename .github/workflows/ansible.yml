name: ansible

on:
  push:
    paths:
      - "configs/ansible/**"
      - ".github/workflows/ansible.yml"
  pull_request:
    paths:
      - "configs/ansible/**"
      - ".github/workflows/ansible.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: configs/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Full "ansible" bundle: provides community.general / community.zabbix,
      # same as the Alpine control node. Versions pinned so a new lint rule
      # cannot turn CI red on its own.
      - name: Install tools
        run: pip install "ansible==12.3.0" "ansible-lint==26.9.0" "yamllint==1.38.0"
      - name: yamllint
        run: yamllint .
      - name: Syntax check
        run: |
          for p in playbooks/*.yml; do
            ansible-playbook --syntax-check -i inventory/hosts.yml "$p"
          done
      - name: ansible-lint
        run: ansible-lint playbooks/ inventory/
